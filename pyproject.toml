[tool.poetry]
name = "ecommerce-trend-platform"
version = "0.1.0"
description = "Scalable ML backend for e-commerce product trend analysis"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "backend.app"}]

[tool.poetry.dependencies]
python = "3.11.9"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-dotenv = "^1.0.0"
pydantic = "^2.9.0"
prophet = "^1.1.4"
xgboost = "^1.8.0"
scikit-learn = "^1.3.0"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
mlflow = "^2.7.0"

[tool.poetry.dev-dependencies]
ruff = "^0.0.316"
mypy = "^1.8.0"
jupyterlab = "^4.0.0"
black = "^24.0.0"

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "C90", "ANN"]

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
