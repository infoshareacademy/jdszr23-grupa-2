[tool.poetry]
name = "ecommerce-trend-platform"
version = "0.1.0"
description = "Scalable ML backend for e-commerce product trend analysis"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-dotenv = "^1.0.0"
pydantic = "^2.13.4"
pydantic-settings = ">=2.3,<3"
scikit-learn = "^1.8.0"
pandas = "^3.0.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.0.316"
mypy = "^1.8.0"
jupyterlab = "^4.0.0"
black = "^24.0.0"

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "C90", "ANN"]

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
